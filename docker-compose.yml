services:
  app:
    build:
      context: .
      args:
        APP_ENV: production
        APP_DEBUG: "false"
    container_name: catalogozapatillas_app
    ports:
      - "80:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost"
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: catalogozapatillas
      DB_USER: catalog_user
      DB_PASS: catalog_pass
    volumes:
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: catalogozapatillas_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: catalogozapatillas
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalogozapatillas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
