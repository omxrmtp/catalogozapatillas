services:
  - type: web
    name: catalogozapatillas
    env: docker
    repo: https://github.com/tu-usuario/catalogozapatillas
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://catalogozapatillas.onrender.com
      - key: APP_TIMEZONE
        value: America/Mexico_City
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_MAX_SIZE
        value: "104857600"
    disk:
      name: uploads
      mountPath: /var/www/html/public/uploads
      sizeGB: 1
    healthCheckPath: /health
